<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الحارس - عبد الله</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #080c14; color: #f8fafc; font-family: system-ui, sans-serif; }
        .gold-card { background: #121824; border: 1px solid rgba(217, 119, 6, 0.4); }
        .gold-text { color: #fbbf24; }
    </style>
</head>
<body class="p-4 md:p-6 max-w-2xl mx-auto min-h-screen space-y-4">
    
    <!-- الهيدر والفلترة -->
    <div class="gold-card p-4 rounded-2xl text-center space-y-3 shadow-xl">
        <h1 class="text-base font-black gold-text">🛡️ بوابة الحارس (عبد الله) - متابعة الحجوزات</h1>
        
        <!-- أزرار اختيار الشاليه -->
        <div class="flex gap-2 justify-center pt-1">
            <button onclick="switchChalet('شاليه بلقيس')" id="btnBalqis" class="px-5 py-2 rounded-xl font-bold text-xs bg-amber-600 text-white shadow">👑 شاليه بلقيس</button>
            <button onclick="switchChalet('شاليه طلة بحر')" id="btnSea" class="px-5 py-2 rounded-xl font-bold text-xs bg-slate-900 text-slate-300 border border-slate-700">🌊 شاليه طلة بحر</button>
        </div>

        <!-- شاشة المجاميع -->
        <div id="chaletTotalBox" class="text-xs font-bold text-emerald-400 bg-slate-900/80 p-2.5 rounded-xl border border-amber-600/30">
            إجمالي المحصل في شاليه بلقيس: 0 د.أ
        </div>
    </div>

    <!-- قائمة الحجوزات المثبتة والمرتبة -->
    <div id="guardBookingsList" class="space-y-3">
        <div class="text-center text-slate-500 py-10 text-xs">جاري تحميل الحجوزات من السحابة...</div>
    </div>

    <!-- قسم تسجيل المصاريف -->
    <div class="gold-card p-4 rounded-2xl space-y-3 shadow-xl mt-6">
        <h2 class="text-xs font-bold gold-text flex items-center gap-1">💸 تسجيل المصاريف اليومية</h2>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <input type="text" id="expenseNote" placeholder="بيان المصروف (مثال: كهرباء، صيانة...)" class="bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white text-xs">
            <input type="number" id="expenseAmount" placeholder="القيمة (د.أ)" class="bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white text-xs">
        </div>
        <button onclick="saveExpense()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">
            💾 حفظ المصروف في السحابة
        </button>
        <div id="expensesList" class="space-y-1.5 pt-2 border-t border-amber-600/20 text-xs">
            <span class="text-slate-500 text-[11px]">لا توجد مصاريف مسجلة.</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, updateDoc, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBLADHraLGTIqPeG8uTLfYL3N-DveiCG0",
            authDomain: "chaletweb-a3c4c.firebaseapp.com",
            projectId: "chaletweb-a3c4c",
            storageBucket: "chaletweb-a3c4c.firebasestorage.app",
            messagingSenderId: "500819160699",
            appId: "1:500819160699:web:fede92cc5eae41de69bcde",
            measurementId: "G-8HZM9GJ54P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeChalet = 'شاليه بلقيس';
        let allBookings = [];
        let allExpenses = [];

        window.switchChalet = function(chalet) {
            activeChalet = chalet;
            if(chalet === 'شاليه بلقيس') {
                document.getElementById('btnBalqis').className = "px-5 py-2 rounded-xl font-bold text-xs bg-amber-600 text-white shadow";
                document.getElementById('btnSea').className = "px-5 py-2 rounded-xl font-bold text-xs bg-slate-900 text-slate-300 border border-slate-700";
            } else {
                document.getElementById('btnSea').className = "px-5 py-2 rounded-xl font-bold text-xs bg-amber-600 text-white shadow";
                document.getElementById('btnBalqis').className = "px-5 py-2 rounded-xl font-bold text-xs bg-slate-900 text-slate-300 border border-slate-700";
            }
            renderGuardView();
        }

        async function loadGuardData() {
            try {
                const bookingSnap = await getDocs(collection(db, "bookings"));
                allBookings = [];
                bookingSnap.forEach((docSnap) => {
                    allBookings.push({ id: docSnap.id, ...docSnap.data() });
                });

                const expenseSnap = await getDocs(collection(db, "expenses"));
                allExpenses = [];
                expenseSnap.forEach((docSnap) => {
                    allExpenses.push({ id: docSnap.id, ...docSnap.data() });
                });

                renderGuardView();
            } catch (e) {
                console.error(e);
                document.getElementById('guardBookingsList').innerHTML = `<div class="text-red-400 text-center text-xs">خطأ في الاتصال بالسحابة</div>`;
            }
        }

        function renderGuardView() {
            const container = document.getElementById('guardBookingsList');
            const totalBox = document.getElementById('chaletTotalBox');
            container.innerHTML = '';

            const filtered = allBookings.filter(b => b.chalet === activeChalet);
            filtered.sort((a, b) => new Date(a.dateCreated) - new Date(b.dateCreated));

            let chaletCollectedTotal = filtered.reduce((sum, b) => sum + (parseFloat(b.guardCollected) || 0), 0);
            totalBox.innerText = `إجمالي المبالغ المحصلة مع عبد الله في ${activeChalet}: ${chaletCollectedTotal} د.أ`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="gold-card p-4 rounded-2xl text-center text-slate-400 text-xs">لا توجد حجوزات مثبتة حالياً في ${activeChalet}</div>`;
                return;
            }

            filtered.forEach(b => {
                const total = parseFloat(b.totalPrice) || 0;
                const paid = parseFloat(b.paidAmount) || 0;
                const baseRem = total - paid;
                const collectedByGuard = parseFloat(b.guardCollected) || 0;
                const cliqCollected = parseFloat(b.cliqCollected) || 0;
                const ownerCollected = parseFloat(b.ownerCollected) || 0;
                
                const actualRemaining = baseRem - collectedByGuard - cliqCollected - ownerCollected;
                const phone = b.phone || '';

                let phoneDisplay = phone ? `<a href="https://wa.me/${phone}" target="_blank" class="text-emerald-400 font-bold hover:underline">📞 ${phone}</a>` : '<span class="text-slate-500">بدون رقم</span>';

                container.innerHTML += `
                    <div class="gold-card p-4 rounded-2xl space-y-3 text-xs shadow-xl">
                        <div class="flex justify-between items-center border-b border-amber-600/30 pb-2">
                            <span class="font-black text-white text-sm">👤 ${b.guestName}</span>
                            <span>${phoneDisplay}</span>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-slate-300">
                            <p>📥 الدخول: <b class="text-amber-400">${b.checkInFormatted || 'حسب الشفت'}</b></p>
                            <p>📤 الخروج: <b class="text-amber-400">${b.checkOutFormatted || 'حسب الشفت'}</b></p>
                            <p>💰 القيمة الكلية: <b class="text-white">${total} د.أ</b></p>
                            <p>💵 الواصل الأساسي (العربون): <b class="text-emerald-400">${paid} د.أ</b></p>
                            <p>🛡️ مع عبد الله (كاش): <b class="text-sky-400">${collectedByGuard} د.أ</b></p>
                            <p>💳 تحويل كليك: <b class="text-emerald-300">${cliqCollected} د.أ</b></p>
                            <p>👑 دفع لصاحب الشاليه: <b class="text-amber-300">${ownerCollected} د.أ</b></p>
                            <p>⏳ المتبقي للتحصيل: <b class="text-red-400">${actualRemaining > 0 ? actualRemaining : 0} د.أ</b></p>
                        </div>

                        <!-- خانة تسجيل الدفعة مع خيارات تحديد الطريقة -->
                        <div class="bg-slate-900 p-3 rounded-xl border border-amber-600/30 space-y-2.5 pt-2">
                            <div class="text-[11px] text-amber-400 font-bold">تسجيل دفعة جديدة من الزبون:</div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <input type="number" id="amount_${b.id}" placeholder="المبلغ (د.أ)" class="bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white text-xs">
                                <select id="method_${b.id}" class="bg-slate-950 border border-amber-500/50 rounded-xl p-2.5 text-amber-300 font-bold text-xs">
                                    <option value="guard">محاسبة عبد الله (كاش)</option>
                                    <option value="cliq">تحويل كليك (CliQ)</option>
                                    <option value="owner">دفعه لصاحب الشاليه مباشرة</option>
                                </select>
                            </div>
                            <button onclick="updatePayment('${b.id}')" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2 rounded-xl shadow transition">➕ تثبيت الدفعة في السحابة</button>
                        </div>
                    </div>
                `;
            });

            // عرض المصاريف
            const expContainer = document.getElementById('expensesList');
            if (allExpenses.length === 0) {
                expContainer.innerHTML = `<span class="text-slate-500 text-[11px]">لا توجد مصاريف مسجلة.</span>`;
            } else {
                expContainer.innerHTML = '';
                allExpenses.forEach(ex => {
                    expContainer.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-950 p-2 rounded-xl border border-slate-800">
                            <span class="text-slate-300">📝 ${ex.note}</span>
                            <div class="flex items-center gap-2">
                                <span class="text-red-400 font-bold">${ex.amount} د.أ</span>
                                <button onclick="deleteExpense('${ex.id}')" class="text-red-500 font-bold px-1">✕</button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        window.updatePayment = async function(id) {
            let amount = parseFloat(document.getElementById(`amount_${id}`).value) || 0;
            let method = document.getElementById(`method_${id}`).value;

            if (amount <= 0) {
                alert('الرجاء إدخال مبلغ صحيح!');
                return;
            }

            try {
                let b = allBookings.find(x => x.id === id);
                let updateData = {};

                if (method === 'guard') {
                    let oldVal = parseFloat(b.guardCollected) || 0;
                    updateData.guardCollected = oldVal + amount;
                } else if (method === 'cliq') {
                    let oldVal = parseFloat(b.cliqCollected) || 0;
                    updateData.cliqCollected = oldVal + amount;
                } else if (method === 'owner') {
                    let oldVal = parseFloat(b.ownerCollected) || 0;
                    updateData.ownerCollected = oldVal + amount;
                }

                await updateDoc(doc(db, "bookings", id), updateData);
                alert('✅ تم تسجيل وتحديث الدفعة بنجاح!');
                loadGuardData();
            } catch (err) {
                alert('❌ حدث خطأ أثناء التحديث');
            }
        }

        window.saveExpense = async function() {
            let note = document.getElementById('expenseNote').value.trim();
            let amount = parseFloat(document.getElementById('expenseAmount').value);

            if (!note || isNaN(amount) || amount <= 0) {
                alert('الرجاء إدخال بيان المصروف وقيمة صحيحة!');
                return;
            }

            try {
                let expenseId = String(Date.now());
                await setDoc(doc(db, "expenses", expenseId), {
                    note: note,
                    amount: amount,
                    date: new Date().toISOString()
                });
                document.getElementById('expenseNote').value = '';
                document.getElementById('expenseAmount').value = '';
                alert('✅ تم حفظ المصروف بنجاح!');
                loadGuardData();
            } catch (err) {
                alert('❌ خطأ في حفظ المصروف');
            }
        }

        window.deleteExpense = async function(id) {
            if (confirm('حذف هذا المصروف؟')) {
                try {
                    await deleteDoc(doc(db, "expenses", id));
                    loadGuardData();
                } catch (e) {
                    alert('❌ خطأ بالحذف');
                }
            }
        }

        loadGuardData();
    </script>
</body>
</html>
