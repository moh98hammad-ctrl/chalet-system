<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل حجزكم - شاليهات حمّاد</title>
    
    <!-- وسوم المعاينة للواتساب (تظهر كبطاقة فخمة) -->
    <meta property="og:title" content="📄 تفاصيل حجزكم وتأكيد الحضور" />
    <meta property="og:description" content="اضغط هنا للاطلاع على تفاصيل الحجز، مواعيد الدخول والخروج، والمبلغ المتبقي." />
    <!-- ملاحظة: يفضل ترفع صورة شعار باسم logo.png في مجلد مشروعك على جيت هب -->
    <meta property="og:image" content="https://moh98hammad-ctrl.github.io/chalet-system/logo.png" />
    <meta property="og:type" content="website" />

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #080c14; color: #f8fafc; font-family: Tahoma, sans-serif; }
        .gold-card { background: #121824; border: 1px solid rgba(217, 119, 6, 0.4); }
        .gold-text { color: #fbbf24; }
    </style>
</head>
<body class="p-4 flex justify-center items-center min-h-screen">

    <div class="gold-card w-full max-w-md p-6 rounded-3xl shadow-2xl space-y-6 text-center">
        <h1 class="text-xl font-black gold-text">📄 تفاصيل حجزكم</h1>
        
        <div id="detailsBox" class="space-y-4 text-right">
            <!-- سيتم تعبئة البيانات هنا تلقائياً من الرابط -->
        </div>

        <div class="pt-4 border-t border-amber-600/30">
            <p class="text-xs text-slate-400">نحن بانتظاركم، نتمنى لكم وقتاً ممتعاً! ✨</p>
        </div>
    </div>

    <script>
        // قراءة البيانات من الرابط وعرضها
        const params = new URLSearchParams(window.location.search);
        const container = document.getElementById('detailsBox');

        container.innerHTML = `
            <div class="space-y-2 text-sm">
                <p class="text-slate-400">اسم الشاليه: <b class="text-white">${params.get('chalet') || '---'}</b></p>
                <p class="text-slate-400">اسم الزبون: <b class="text-white">${params.get('name') || '---'}</b></p>
                <p class="text-slate-400">تاريخ الدخول: <b class="text-amber-400">${params.get('in') || '---'}</b></p>
                <p class="text-slate-400">تاريخ الخروج: <b class="text-amber-400">${params.get('out') || '---'}</b></p>
                <div class="border-t border-slate-700 my-2 pt-2">
                    <p class="text-slate-400">إجمالي المبلغ: <b class="text-white">${params.get('total')} د.أ</b></p>
                    <p class="text-slate-400">العربون المدفوع: <b class="text-emerald-400">${params.get('paid')} د.أ</b></p>
                    <p class="text-slate-400">المبلغ المتبقي: <b class="text-red-400">${params.get('rem')} د.أ</b></p>
                </div>
            </div>
        `;
    </script>
</body>
</html>
