<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - إدارة الشاليهات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #080c14; color: #f8fafc; font-family: system-ui, sans-serif; }
        .gold-card { background: #121824; border: 2px solid #d97706; box-shadow: 0 25px 50px -12px rgba(217, 119, 6, 0.25); }
        .gold-text { color: #fbbf24; }
        .gold-btn { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); color: #ffffff; }
        .gold-btn:hover { background: linear-gradient(135deg, #b45309 0%, #92400e 100%); }
    </style>
</head>
<body class="min-h-screen flex justify-center items-center p-4">
    <div class="gold-card w-full max-w-md p-8 rounded-3xl text-right space-y-6">
        <div class="text-center space-y-2 border-b border-amber-600/30 pb-4">
            <h1 class="text-2xl font-black gold-text">👑 نظام إدارة الشاليهات</h1>
            <p class="text-xs text-slate-400">يرجى تسجيل الدخول للمتابعة</p>
        </div>

        <div class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 font-bold mb-1">اسم المستخدم أو الموظف</label>
                <input type="text" id="username" placeholder="مثال: admin أو employee" class="w-full bg-slate-900 border border-amber-600/40 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-slate-300 font-bold mb-1">كلمة المرور</label>
                <input type="password" id="password" placeholder="••••••••" class="w-full bg-slate-900 border border-amber-600/40 rounded-xl p-3 text-white focus:outline-none focus:border-amber-500">
            </div>

            <button onclick="handleLogin()" class="w-full gold-btn font-black py-3.5 rounded-2xl shadow-lg transition text-sm tracking-wide mt-2">
                🔑 تسجيل الدخول
            </button>
        </div>
    </div>

    <script>
        function handleLogin() {
            let u = document.getElementById('username').value.trim();
            let p = document.getElementById('password').value.trim();

            if ((u === 'admin' && p === '1234') || (u === 'employee' && p === '1234') || (u === 'محمد' && p === '1234')) {
                localStorage.setItem('chaletLoggedIn', 'true');
                localStorage.setItem('chaletUser', u);
                window.location.href = 'index.html';
            } else {
                alert('❌ اسم المستخدم أو كلمة المرور غير صحيحة!');
            }
        }
    </script>
</body>
</html>
